*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#d9f99d,#bae6fd);font-family:Arial,sans-serif;color:#164e37;padding:18px}.wrap{max-width:850px;margin:auto;background:white;border-radius:24px;padding:24px;box-shadow:0 8px 35px #0002;text-align:center}h1{font-size:clamp(23px,4vw,36px);margin:5px 0;color:#166534}.sub{color:#475569}.status{display:flex;justify-content:space-between;font-size:19px;font-weight:bold;margin:20px 0}.track{height:12px;background:#e5e7eb;border-radius:20px;overflow:hidden}.fill{height:100%;width:0;background:#22c55e;transition:.25s}.signs{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:18px 0}.sign{width:clamp(55px,12vw,93px);background:#f0f9ff;border:2px solid #93c5fd;border-radius:12px;overflow:hidden}.sign img{width:100%;display:block;aspect-ratio:1;object-fit:cover}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.option{border:3px solid #7dd3fc;border-radius:18px;background:#f0f9ff;cursor:pointer;padding:16px 5px;min-height:145px;font-size:65px;transition:.15s}.option:hover:not(:disabled){transform:scale(1.02);background:#dbeafe}.option:disabled{cursor:default}.correct{background:#bbf7d0!important;border-color:#16a34a!important}.incorrect{background:#fecaca!important;border-color:#dc2626!important}.feedback{min-height:44px;font-size:23px;font-weight:bold;margin:18px}.action{background:#15803d;color:white;border:0;border-radius:14px;padding:14px 24px;font-size:20px;font-weight:bold;cursor:pointer}.action:hover{background:#166534}.small{font-size:13px;color:#64748b;margin-top:24px}.answer{font-size:24px;font-weight:bold;color:#166534}#end{display:none}@media(max-width:480px){.wrap{padding:14px}.option{font-size:52px;min-height:115px}.sign{width:56px}.status{font-size:16px}}
</style></head><body><main class="wrap"><h1>🥦 JOM KENALI SAYUR-SAYURAN! 🥕</h1><p class="sub">Padankan ejaan jari dengan gambar sayur</p><section id="game"><div class="status"><span id="count"></span><span id="score"></span></div><div class="track"><div class="fill" id="progress"></div></div><h2>Lihat ejaan jari. Pilih gambar yang betul.</h2><div class="signs" id="signs" aria-label="Ejaan jari"></div><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="action" id="next" hidden>Soalan seterusnya ➜</button></section><section id="end"><h2>🎉 Tahniah! 🎉</h2><div style="font-size:85px">🏆</div><h2 id="result"></h2><p id="encourage"></p><button class="action" id="restart">Main Semula 🔄</button></section><p class="small">Imej ejaan jari dipetik daripada carta yang dibekalkan oleh guru. Sila semak kesesuaian isyarat dengan bahan pengajaran KTBM sekolah.</p></main><script>

const questions=[{"name": "LOBAK", "emoji": "🥕"}, {"name": "TIMUN", "emoji": "🥒"}, {"name": "TERUNG", "emoji": "🍆"}, {"name": "BROKOLI", "emoji": "🥦"}, {"name": "CILI", "emoji": "🌶️"}, {"name": "KUBIS", "emoji": "🥬"}, {"name": "TOMATO", "emoji": "🍅"}, {"name": "JAGUNG", "emoji": "🌽"}, {"name": "KENTANG", "emoji": "🥔"}, {"name": "BAWANG", "emoji": "🧅"}];
let index=0,points=0,answered=false;
const $=id=>document.getElementById(id);
function shuffle(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function render(){answered=false;let q=questions[index];$('count').textContent=`Soalan ${index+1} / ${questions.length}`;$('score').textContent=`Markah: ${points}/100`;$('progress').style.width=`${index*10}%`;$('feedback').textContent='';$('next').hidden=true;$('signs').replaceChildren();for(let ch of q.name){let card=document.createElement('div');card.className='sign';let img=document.createElement('img');img.src=letters[ch];img.alt='Isyarat huruf '+ch;card.append(img);$('signs').append(card)}$('options').replaceChildren();let wrong=shuffle(questions.filter(x=>x.name!==q.name)).slice(0,3);for(let choice of shuffle([q,...wrong])){let b=document.createElement('button');b.className='option';b.textContent=choice.emoji;b.setAttribute('aria-label','Gambar '+choice.name);b.onclick=()=>check(choice.name,b);$('options').append(b)}}
function check(name,button){if(answered)return;answered=true;let correct=questions[index].name;if(name===correct){points+=10;button.classList.add('correct');$('feedback').textContent='✅ Betul! '+correct;$('feedback').style.color='#15803d'}else{button.classList.add('incorrect');$('feedback').textContent='❌ Cuba lagi pada soalan berikutnya. Jawapan: '+correct;$('feedback').style.color='#b91c1c'}for(let b of $('options').children){b.disabled=true;if(b.getAttribute('aria-label')==='Gambar '+correct)b.classList.add('correct')}$('score').textContent=`Markah: ${points}/100`;$('next').textContent=index===9?'Lihat Keputusan 🏆':'Soalan seterusnya ➜';$('next').hidden=false}
$('next').onclick=()=>{index++;if(index<questions.length)render();else{$('game').style.display='none';$('end').style.display='block';$('result').textContent=`Markah akhir: ${points}/100`;$('encourage').textContent=points===100?'CEMERLANG! ⭐⭐⭐':points>=70?'BAGUS! ⭐⭐':'TERUSKAN BERLATIH! ⭐'}};
$('restart').onclick=()=>{index=0;points=0;$('game').style.display='block';$('end').style.display='none';render()};render();
</script></body></html>
